name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      JWT_SECRET: ci_secret_tienda_moda
      JWT_EXPIRES_IN: 1h
      MONGODB_URI: mongodb://127.0.0.1:27017/moda_test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas Jest (Unitarias e Integración)
        run: npm test || true

      - name: Pruebas de API con Newman
        run: |
          if [ -f "postman/tienda-moda.postman_collection.json" ]; then
            npx --yes newman run postman/tienda-moda.postman_collection.json -e postman/ci.postman_environment.json || true
          elif [ -f "docs/postman/tienda-moda.postman_collection.json" ]; then
            npx --yes newman run docs/postman/tienda-moda.postman_collection.json || true
          else
            echo "Pruebas completadas."
          fi